name: CI

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      NODE_ENV: production

      NEXTAUTH_URL: https://repomind.example.com
      NEXT_PUBLIC_SITE_URL: https://repomind.example.com

      NEXTAUTH_SECRET: ci-only-nextauth-secret-that-is-long-enough-123456

      SERVER_ENCRYPTION_KEY: ci-only-encryption-key-that-is-long-enough-123456

      GITHUB_CLIENT_ID: Iv1.ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder-secret

      GITHUB_APP_ID: "123456"
      GITHUB_APP_SLUG: repomind-ci

      GITHUB_APP_PRIVATE_KEY: ci-placeholder-private-key

      GITHUB_WEBHOOK_SECRET: ci-placeholder-webhook-secret

      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key

      ANALYSIS_EXECUTION_MODE: bullmq
      REDIS_URL: redis://127.0.0.1:6379

      GEMINI_API_KEY: ci-placeholder-gemini-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
